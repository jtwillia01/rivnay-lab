# Logo files live in assets/img/logos/.
# `h` is the display height in px, set so every mark carries a similar visual area rather than a
# uniform height (a round seal needs to be taller than a wordmark to read as the same size).
# Recompute as 56 * (3 / aspect_ratio) ** 0.35. `wide: true` gives a long lockup a double cell.
# Order follows the old Research page; Sloan (old Funding page) and MRSEC appended.
funders:
  - name: National Science Foundation
    logo: nsf.svg
    h: 82
    url: https://www.nsf.gov
  - name: National Institutes of Health
    logo: nih.png
    h: 79
    url: https://www.nih.gov
  - name: Defense Advanced Research Projects Agency
    logo: darpa.png
    h: 66
    url: https://www.darpa.mil
  - name: Chan Zuckerberg Biohub Chicago
    logo: biohub.svg
    h: 55
    url: https://biohub.org
    wide: true
  - name: Advanced Research Projects Agency for Health
    logo: arpa-h.png
    h: 53
    url: https://arpa-h.gov
  - name: Air Force Office of Scientific Research
    logo: afosr.png
    h: 82
    url: https://www.afrl.af.mil/AFOSR/
  - name: Alfred P. Sloan Foundation
    logo: sloan-foundation.png
